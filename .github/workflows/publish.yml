name: Publish Hitbench

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hitbench-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read build version from commit subject
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $build = & ./.github/scripts/Get-HitbenchBuildVersion.ps1 -Subject $env:COMMIT_MESSAGE
          if (-not $build) { exit 0 }
          "version=$($build.Version)" >> $env:GITHUB_OUTPUT
          "numeric=$($build.NumericVersion)" >> $env:GITHUB_OUTPUT
          "description=$($build.Description)" >> $env:GITHUB_OUTPUT

      - name: Reject existing tags and releases
        id: available
        if: steps.version.outputs.version != ''
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$env:BUILD_VERSION"
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:BUILD_VERSION already exists." }
          if ($LASTEXITCODE -ne 2) { throw 'Unable to check remote tags.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == `"$env:BUILD_VERSION`") | .id"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing releases.' }
          if ($release) { throw "Release $env:BUILD_VERSION already exists." }

      - name: Set up .NET
        if: steps.version.outputs.version != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package self-contained single-file application
        id: package
        if: steps.version.outputs.version != ''
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.version.outputs.numeric }}
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'hitbench-publish'
          dotnet publish Hitbench/Hitbench.csproj -c Release -p:PublishProfile=FolderProfile -o $publishDir "-p:OHsReleaseVersion=$env:BUILD_VERSION" "-p:VersionPrefix=$env:NUMERIC_VERSION" "-p:SourceRevisionId=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained single-file publish failed.' }
          $archive = Join-Path $env:RUNNER_TEMP "Hitbench-$env:BUILD_VERSION-win-x64.zip"
          & ./.github/scripts/New-HitbenchReleasePackage.ps1 -PublishDirectory $publishDir -Version $env:BUILD_VERSION -Commit $env:GITHUB_SHA -DestinationZip $archive

      - name: Create tag and GitHub Release
        id: release
        if: steps.version.outputs.version != ''
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION_TAG: ${{ steps.version.outputs.description }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Hitbench-$env:BUILD_VERSION-win-x64.zip"
          git tag $env:BUILD_VERSION $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create release tag.' }
          git push origin "refs/tags/$env:BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push release tag; it may already exist.' }
          gh release create $env:BUILD_VERSION $archive --verify-tag --target $env:GITHUB_SHA --title $env:BUILD_VERSION --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create GitHub Release.' }
          & ./.github/scripts/Set-HitbenchDescriptionTag.ps1 -Description $env:DESCRIPTION_TAG -Commit $env:GITHUB_SHA
